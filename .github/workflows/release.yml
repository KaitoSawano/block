name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: zenachain-linux-x64.tar.gz
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: zenachain-linux-arm64.tar.gz
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: zenachain-macos-x64.tar.gz
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: zenachain-macos-arm64.tar.gz
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zenachain-windows-x64.zip
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p zenachain --bin zenachain --bin zenachaind

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p zenachain --bin zenachain --bin zenachaind

      - name: Package Linux/macOS
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/zenachain package/
          cp target/${{ matrix.target }}/release/zenachaind package/
          tar -czf ${{ matrix.archive }} -C package .

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir package
          Copy-Item target/${{ matrix.target }}/release/zenachain.exe package/
          Copy-Item target/${{ matrix.target }}/release/zenachaind.exe package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
