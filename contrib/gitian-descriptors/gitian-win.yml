---
name: "zenachain-win"
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "curl"
- "g++"
- "git"
- "pkg-config"
- "autoconf"
- "libtool"
- "automake"
- "faketime"
- "bsdmainutils"
- "ca-certificates"
- "mingw-w64"
remotes:
- "url": "https://github.com/KaitoSawano/block.git"
  "dir": "zenachain"
files: []
script: |
  set -e -o pipefail
  export PATH="$HOME/.cargo/bin:$PATH"
  export SOURCE_DATE_EPOCH=$(date -d "2026-01-01" +%s)
  cd zenachain
  if ! command -v cargo >/dev/null 2>&1; then
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    . "$HOME/.cargo/env"
  fi
  rustup target add x86_64-pc-windows-gnu
  RUSTFLAGS="--remap-path-prefix=$PWD=/build/zenachain" \
    cargo build --release --target x86_64-pc-windows-gnu \
    --bin zenachain --bin zenachaind
  mkdir -p dist
  cp target/x86_64-pc-windows-gnu/release/zenachain.exe dist/
  cp target/x86_64-pc-windows-gnu/release/zenachaind.exe dist/
  zip -r zenachain-win-x64.zip dist/
