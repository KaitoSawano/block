---
name: "zenachain-osx"
suites:
- "jammy"
architectures:
- "amd64"
packages:
- "curl"
- "g++"
- "git"
- "pkg-config"
- "autoconf"
- "libtool"
- "automake"
- "faketime"
- "bsdmainutils"
- "ca-certificates"
- "clang"
- "libssl-dev"
remotes:
- "url": "https://github.com/KaitoSawano/block.git"
  "dir": "zenachain"
files: []
script: |
  set -e -o pipefail
  export PATH="$HOME/.cargo/bin:$PATH"
  export SOURCE_DATE_EPOCH=$(date -d "2026-01-01" +%s)
  cd zenachain
  if ! command -v cargo >/dev/null 2>&1; then
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    . "$HOME/.cargo/env"
  fi
  rustup target add x86_64-apple-darwin
  rustup target add aarch64-apple-darwin
  RUSTFLAGS="--remap-path-prefix=$PWD=/build/zenachain" \
    cargo build --release --target x86_64-apple-darwin \
    --bin zenachain --bin zenachaind
  RUSTFLAGS="--remap-path-prefix=$PWD=/build/zenachain" \
    cargo build --release --target aarch64-apple-darwin \
    --bin zenachain --bin zenachaind
  mkdir -p dist
  cp target/x86_64-apple-darwin/release/zenachain dist/zenachain-x64
  cp target/x86_64-apple-darwin/release/zenachaind dist/zenachaind-x64
  cp target/aarch64-apple-darwin/release/zenachain dist/zenachain-arm64
  cp target/aarch64-apple-darwin/release/zenachaind dist/zenachaind-arm64
  tar -czf zenachain-osx.tar.gz -C dist .
