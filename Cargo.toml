[package]
name = "zenachain"
version = "0.1.0"
edition = "2024"
description = "ZenaChain (ZENAC) post-quantum node, CLI, and miner (ML-DSA-65)"
license = "MIT"

[lib]
name = "zenachain"
path = "src/lib.rs"

[[bin]]
name = "zenachain"
path = "src/main.rs"

[[bin]]
name = "zenachaind"
path = "src/bin/zenachaind.rs"

[[bin]]
name = "zenachain-miner"
path = "src/bin/zenachain-miner.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
ml-dsa = { version = "0.1.1", features = ["getrandom", "alloc"] }

[profile.release]
opt-level = 3
lto = true
