[package]
name = "zenachain"
version = "0.1.0"
edition = "2021"
description = "ZenaChain (ZENAC) node, CLI, and miner"
license = "MIT"
rust-version = "1.75"

[lib]
name = "zenachain"
path = "src/lib.rs"

[[bin]]
name = "zenachain"
path = "src/main.rs"

[[bin]]
name = "zenachaind"
path = "src/bin/zenachaind.rs"

[[bin]]
name = "zenachain-miner"
path = "src/bin/zenachain-miner.rs"

[[bin]]
name = "zenachain-genesis"
path = "src/bin/zenachain-genesis.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
