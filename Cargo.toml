[package]
name = "zenachain"
version = "0.1.0"
edition = "2021"
description = "ZenaChain (ZENAC) node, CLI, and miner"
license = "MIT"

[lib]
name = "zenachain"
path = "src/lib.rs"

[[bin]]
name = "zenachain"
path = "src/main.rs"

[[bin]]
name = "zenachaind"
path = "src/bin/zenachaind.rs"

[[bin]]
name = "zenachain-miner"
path = "src/bin/zenachain-miner.rs"

[[bin]]
name = "zenachain-genesis"
path = "src/bin/zenachain-genesis.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "ping",
    "identify",
    "gossipsub",
    "kad",
    "request-response",
    "cbor",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
